uri: "${MONGODB_URI}"
database: "${MONGODB_DATABASE}"

collections:
  gkg_records: gkg_records
  execution_metrics: execution_metrics
  crawled_data: crawled_data
  eventos: eventos
  queries: queries
  whitelist: whitelist
  scrapper: scrapper
  metrics: metrics
  media_cloud_sources: media_cloud_sources
  bluesky_posts: bluesky_posts
  threads_posts: threads_posts
  threads_replies: threads_replies
  url_queue: url_queue
  url_crawls: url_crawls
  pipeline_runs: pipeline_runs

connect_timeout_ms: 30000
server_selection_timeout_ms: 30000

ordered_inserts: false

ensure_indexes_on_startup: true
